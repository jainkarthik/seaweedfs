backend weed-s3-backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server s3-1 localhost:8000 check inter 5s fall 2 rise 1
    server s3-2 localhost:8001 check inter 5s fall 2 rise 1
    server s3-3 localhost:8002 check inter 5s fall 2 rise 1
    server s3-4 localhost:8003 check inter 5s fall 2 rise 1
